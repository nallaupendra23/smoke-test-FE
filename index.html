<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RingZ.ai</title>
    <style>
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #1d1d1f;
      }
      #boot-card {
        width: min(420px, 100%);
        padding: 28px;
        border: 1px solid #e5e5ea;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      }
      #boot-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
      }
      #boot-message {
        margin: 0;
        color: #6e6e73;
        overflow-wrap: anywhere;
      }
    </style>
    <script>
      function showBootError(message) {
        var el = document.getElementById('boot-message')
        if (el) el.textContent = message || 'The app failed before it could render.'
      }
      window.addEventListener('error', function (event) {
        showBootError(event.message)
      })
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason
        showBootError(reason && reason.message ? reason.message : String(reason))
      })
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="boot">
      <div id="boot-card">
        <p id="boot-title">Loading RingZ.ai</p>
        <p id="boot-message">Starting the frontend...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
